packages:
  - apps/*
  - packages/*

# Native build scripts are blocked by default (pnpm >= 10); only reviewed
# packages are allowed (pnpm 11 uses the allowBuilds map).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - marked@18.0.12
  - '@tauri-apps/plugin-updater@2.13.1'

overrides:
  ansi-regex: ^6.1.0
