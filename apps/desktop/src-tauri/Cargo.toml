[package]
name = "deepread-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deepread desktop shell (Tauri 2)"

[lib]
name = "deepread_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
sha2 = "0.10"
# Already in the lock file (transitive); cover bytes travel as base64 over IPC.
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["time", "net", "macros", "rt"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
quick-xml = { version = "0.41.0", default-features = false }
