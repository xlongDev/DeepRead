[package]
name = "deepread-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deepread desktop shell (Tauri 2)"

[lib]
name = "deepread_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# 显式安装进程级 CryptoProvider 用:reqwest(aws-lc-rs)与 tungstenite(ring)
# 同时启用两个 provider,rustls 0.23 拒绝自动二选一 —— 不装默认值,首次
# TLS 握手就 panic(依赖升级 db6b13e 引入,TTS「合成中」卡死即此)。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
sha2 = "0.11"
# Already in the lock file (transitive); cover bytes travel as base64 over IPC.
base64 = "0.23"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["time", "net", "macros", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
# 0.42 起底层换成 libsqlite3-sys 0.40:RUSTSEC-2026-0459(C SQLite
# CVE-2026-119375)要求 >=0.39,0.37 那代的 ^0.35 无法单独升级。
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
quick-xml = { version = "0.42.0", default-features = false }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
