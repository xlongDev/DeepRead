name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust (fmt / clippy / test)
    # 固定 24.04:ubuntu-latest 已切到 26.04,其 mirror+file apt 源在 CI 上
    # 出现过 DNS 解析失败 + 部分包 404,装 180+ 个 webkit 依赖会拖到 20min
    # 后 exit 100。24.04 是 Tauri 2 官方支持的 LTS,libwebkit2gtk-4.1-dev 齐备。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          # --no-install-recommends:只要编译/链接必需的头文件,gstreamer 插件等
          # recommends 会把下载量翻一倍,也放大 apt 源故障面。
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Create frontend dist placeholder (tauri-build requires it)
        run: mkdir -p apps/desktop/dist

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # ADR-0008: ts-rs 在 cargo test 里刷新 protocol/generated/,生成物必须
      # 与仓库一致 —— 过期即红(改了 Rust DTO 忘记重新生成/提交就会在这里挂)。
      - name: Generated protocol types are up to date
        run: git diff --exit-code packages/shared/src/protocol/generated/

  # security-audit.md 遗留项①:Rust 依赖的 advisory 扫描。阻断式 —— 有告警
  # 就该停下来处理,而不是红灯习惯化。RustSec 数据库随每次运行刷新。
  audit:
    name: Rust dependencies (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit
